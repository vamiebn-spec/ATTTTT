
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atelier</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="grid grid-cols-1 lg:grid-cols-2 gap-10 px-10 py-20">

    <form class="bg-slate-200 w-170 px-10 py-30 rounded-xl" id="form">

        <!-- Identification de l'élève -->
        <h1 class="text-2xl font-semibold py-3">
            Ajouter un élève
        </h1>

        <div class="flex flex-row gap-5">

            <!-- Nom -->
            <input class="input w-50" type="text" id="nom" placeholder="EX : Jean">

            <!-- Classe -->
            <input class="input w-50" type="text" id="classe" placeholder="Classe">

            <!-- Matricule -->
            <input class="input w-50" type="number" id="matricule" placeholder="Matricule">

        </div>


        <!-- Les matières -->

        <div class="flex gap-8">

            <!-- Mathématiques -->
            <div class="flex flex-col gap-3 w-30 mt-4">

                <label class="text-xl font-bold">
                    Math :
                </label>

                <input class="rounded-sm px-3" type="number" id="note1" placeholder="Note">

                <input class="rounded-sm px-3" type="number" id="coef1" placeholder="Coef : 2">

                <input class="rounded-sm px-3" type="number" id="exam1" placeholder="Note exam">

            </div>


            <!-- Physique -->
            <div class="flex flex-col gap-3 w-30 mt-4">

                <label class="text-xl font-bold">
                    Physique :
                </label>

                <input class="rounded-sm px-3" type="number" id="note2" placeholder="Note">

                <input class="rounded-sm px-3" type="number" id="coef2" placeholder="Coef : 3">

                <input class="rounded-sm px-3" type="number" id="exam2" placeholder="Note exam">

            </div>


            <!-- SVT -->
            <div class="flex flex-col gap-3 w-30 mt-4">

                <label class="text-xl font-bold">
                    SVT :
                </label>

                <input class="rounded-sm px-3" type="number" id="note3" placeholder="Note">

                <input class="rounded-sm px-3" type="number" id="coef3" placeholder="Coef : 2">

                <input class="rounded-sm px-3" type="number" id="exam3" placeholder="Note exam">

            </div>

        </div>


        <!-- Bouton -->
        <div class="ml-37">

            <button type="submit" class="btn btn-neutral mt-5 px-8">
                Moyenne
            </button>

        </div>

    </form>

<script src="main.js"></script>
</body>

</html>
